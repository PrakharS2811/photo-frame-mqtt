<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Frame Uploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(217, 70, 239, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(217, 70, 239, 0.3);
        }
        .glass-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .animate-glow {
            animation: pulseGlow 4s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 sm:p-6 md:p-8 text-slate-100 relative overflow-x-hidden">

    <div class="absolute top-10 left-10 w-72 h-72 bg-purple-600/20 rounded-full blur-3xl pointer-events-none animate-glow"></div>
    <div class="absolute bottom-10 right-10 w-80 h-80 bg-pink-600/20 rounded-full blur-3xl pointer-events-none animate-glow" style="animation-delay: 2s;"></div>

    <main class="w-full max-w-md mx-auto z-10">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 shadow-lg shadow-purple-500/30 mb-4 text-white text-2xl">
                <i class="fa-solid fa-camera"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-white via-purple-200 to-pink-300 bg-clip-text text-transparent">
                Photo Frame Uploader
            </h1>
            <p class="text-sm text-slate-400 mt-2">Select your photo and send it directly to your smart frame</p>
        </div>

        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden mb-6">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-purple-500 via-pink-500 to-purple-600"></div>

            <!-- Image Preview Box / Input Trigger -->
            <div id="previewContainer" class="w-full h-48 sm:h-56 rounded-2xl border-2 border-dashed border-white/20 bg-slate-900/40 flex flex-col items-center justify-center relative overflow-hidden group cursor-pointer transition-all duration-300 hover:border-purple-400/50 mb-5">
                <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-20 w-full h-full" title="Upload image">
                
                <div id="placeholderContent" class="flex flex-col items-center justify-center text-center p-4 transition-transform duration-300 group-hover:scale-105">
                    <div class="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center text-purple-400 mb-3 text-xl group-hover:bg-purple-500/20 transition-colors">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                    </div>
                    <span class="text-sm font-medium text-slate-200">Tap or click to browse image</span>
                    <span class="text-xs text-slate-400 mt-1">Supports JPG, PNG, WEBP (Max 10MB)</span>
                </div>

                <img id="imagePreview" alt="Selected Preview" class="absolute inset-0 w-full h-full object-cover hidden z-10 transition-opacity duration-500">
                
                <div id="changeOverlay" class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-15 flex flex-col items-center justify-center text-white hidden">
                    <i class="fa-solid fa-rotate text-xl mb-1 text-purple-400"></i>
                    <span class="text-xs font-medium">Change Image</span>
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Selected File Name</label>
                <div class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-slate-900/60 border border-white/10 text-sm">
                    <i class="fa-regular fa-file-image text-purple-400 text-lg flex-shrink-0"></i>
                    <span id="fileNameDisplay" class="text-slate-300 truncate font-medium">No file chosen yet</span>
                </div>
            </div>

            <div class="space-y-4 pt-2 border-t border-white/10">
                <h2 class="text-base font-semibold text-slate-200 text-center tracking-wide">Upload picture to</h2>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <button onclick="handleFrameUpload('1')" id="frame1Btn" disabled class="glass-button group relative flex items-center justify-center space-x-3 py-4 px-5 rounded-2xl text-slate-100 font-medium overflow-hidden transition-all">
                        <div class="absolute inset-0 bg-gradient-to-r from-purple-600/20 to-pink-600/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div class="w-9 h-9 rounded-xl bg-purple-500/20 text-purple-300 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-frame"></i>
                        </div>
                        <div class="text-left">
                            <div class="text-sm font-bold text-white group-hover:text-purple-300 transition-colors">Photo frame 1</div>
                            <div class="text-xs text-slate-400">Classic Gallery</div>
                        </div>
                    </button>

                    <button onclick="handleFrameUpload('2')" id="frame2Btn" disabled class="glass-button group relative flex items-center justify-center space-x-3 py-4 px-5 rounded-2xl text-slate-100 font-medium overflow-hidden transition-all">
                        <div class="absolute inset-0 bg-gradient-to-r from-pink-600/20 to-purple-600/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div class="w-9 h-9 rounded-xl bg-pink-500/20 text-pink-300 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-wand-magic"></i>
                        </div>
                        <div class="text-left">
                            <div class="text-sm font-bold text-white group-hover:text-pink-300 transition-colors">Photo frame 2</div>
                            <div class="text-xs text-slate-400">Modern Collage</div>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <div id="toastNotification" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 z-50 bg-slate-900/95 border border-purple-500/40 text-slate-200 px-5 py-3 rounded-2xl shadow-2xl backdrop-blur-md flex items-center space-x-3 pointer-events-none max-w-sm text-center">
            <div id="toastIcon" class="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-sm flex-shrink-0">
                <i class="fa-solid fa-check"></i>
            </div>
            <span id="toastMessage" class="text-sm font-medium">Success message goes here</span>
        </div>
    </main>

    <script>
        const API_ENDPOINT = "https://z4cxjyyft5.execute-api.us-east-1.amazonaws.com/default/generate-presigned-url-mqtt"; // Leave empty for deployment configuration

        const imageInput = document.getElementById('imageInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const imagePreview = document.getElementById('imagePreview');
        const placeholderContent = document.getElementById('placeholderContent');
        const changeOverlay = document.getElementById('changeOverlay');
        const frame1Btn = document.getElementById('frame1Btn');
        const frame2Btn = document.getElementById('frame2Btn');
        const toastNotification = document.getElementById('toastNotification');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');

        let selectedFile = null;
        const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB limit

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast('Invalid file format! Please select a valid image file (e.g. JPG, PNG, WEBP).', 'error');
                resetSelection();
                return;
            }

            if (file.size > MAX_FILE_SIZE) {
                showToast('File size exceeds 10MB limit! Please choose a smaller image.', 'error');
                resetSelection();
                return;
            }

            selectedFile = file;
            fileNameDisplay.textContent = file.name;
            fileNameDisplay.classList.add('text-purple-300', 'font-semibold');

            const reader = new FileReader();
            reader.onload = function(event) {
                imagePreview.src = event.target.result;
                imagePreview.classList.remove('hidden');
                placeholderContent.classList.add('hidden');
                changeOverlay.classList.remove('hidden');
            }
            reader.readAsDataURL(file);

            frame1Btn.disabled = false;
            frame2Btn.disabled = false;

            showToast('Image loaded and validated successfully!', 'success');
        });

        function resetSelection() {
            imageInput.value = '';
            selectedFile = null;
            fileNameDisplay.textContent = 'No file chosen yet';
            fileNameDisplay.classList.remove('text-purple-300', 'font-semibold');
            imagePreview.src = '';
            imagePreview.classList.add('hidden');
            placeholderContent.classList.remove('hidden');
            changeOverlay.classList.add('hidden');
            frame1Btn.disabled = true;
            frame2Btn.disabled = true;
        }

       // Handle upload using a Pre-signed S3 URL
        async function handleFrameUpload(frameNumber) {
            if (!selectedFile) {
                showToast('Please select an image first before choosing a frame.', 'error');
                return;
            }

            showToast(`Preparing upload for Photo frame ${frameNumber}...`, 'success');

            if (!API_ENDPOINT || API_ENDPOINT.trim() === "") {
                console.warn('API_ENDPOINT is empty. Upload simulated.');
                showToast(`[Simulated] Ready to upload ${selectedFile.name} to Frame ${frameNumber}`, 'success');
                return;
            }

            try {
                // Step 1: Request the pre-signed S3 URL from your Lambda function
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fileName: selectedFile.name,
                        fileType: selectedFile.type,
                        frameNumber: String(frameNumber)
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to get upload authorization.');
                }

                const data = await response.json();
                const uploadUrl = data.uploadUrl; // Assumes your Lambda returns { "uploadUrl": "..." }

                if (!uploadUrl) {
                    throw new Error('Invalid pre-signed URL received from server.');
                }

                showToast(`Uploading photo to Photo frame ${frameNumber}...`, 'success');

                // Step 2: Upload the image file directly to S3 via PUT request
                const uploadResponse = await fetch(uploadUrl, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': selectedFile.type
                    },
                    body: selectedFile
                });

                if (uploadResponse.ok) {
                    showToast(`Successfully uploaded to Photo frame ${frameNumber}!`, 'success');
                } else {
                    throw new Error('Failed to upload image directly to storage.');
                }

            } catch (error) {
                console.error('Upload error:', error);
                showToast(error.message || 'An error occurred during upload.', 'error');
            }
        }

        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            if (type === 'success') {
                toastIcon.className = 'w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-sm flex-shrink-0';
                toastIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else {
                toastIcon.className = 'w-7 h-7 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center text-sm flex-shrink-0';
                toastIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            }

            toastNotification.classList.remove('translate-y-20', 'opacity-0');
            toastNotification.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toastNotification.classList.remove('translate-y-0', 'opacity-100');
                toastNotification.classList.add('translate-y-20', 'opacity-0');
            }, 4000);
        }
    </script>
</body>
</html>
